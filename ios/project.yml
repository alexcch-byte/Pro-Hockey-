# XcodeGen spec: generates PowerPlayHockey.xcodeproj (the repo only ships a Swift package + app sources).
# Local use on a Mac:  brew install xcodegen && cd ios && xcodegen generate && open PowerPlayHockey.xcodeproj
name: PowerPlayHockey
options:
  bundleIdPrefix: com.tablehockey
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  PowerPlayHockeyCore:
    path: PowerPlayHockeyCore
targets:
  PowerPlayHockey:
    type: application
    platform: iOS
    sources:
      - path: PowerPlayHockeyApp
        excludes:
          - Info.plist
    dependencies:
      - package: PowerPlayHockeyCore
        product: PowerPlayHockeyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tablehockey.game
        PRODUCT_NAME: PowerPlayHockey
        INFOPLIST_FILE: PowerPlayHockeyApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_BITCODE: NO
