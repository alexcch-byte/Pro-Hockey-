name: Build iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (M1) runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Build Swift Package (PowerPlayHockeyCore)
        run: |
          cd ios/PowerPlayHockeyCore
          swift build -v
